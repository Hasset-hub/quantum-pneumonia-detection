[project]
name = "qpd"
version = "0.1.0"
description = "Hybrid quantum-classical pneumonia detection (COSC 461/561 Project 2)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
